# Prebuilt binaries, so using touchstone does not require a Rust toolchain.
#
# `cargo install --git` works and is documented, but it makes every user compile a 13-crate
# workspace with a bundled SQLite. That is a real barrier for the people most worth reaching:
# the ones evaluating whether this is worth their time at all.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple silicon
            target: aarch64-apple-darwin
          - os: macos-13        # Intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --bin touchstone --target ${{ matrix.target }}

      # A binary that ships without passing the drills is a binary nobody should trust. rusqlite
      # is vendored, so there is no system SQLite to differ between build and run.
      - name: Conformance
        run: |
          cp target/${{ matrix.target }}/release/touchstone target/release/touchstone 2>/dev/null || \
            (mkdir -p target/release && cp target/${{ matrix.target }}/release/touchstone target/release/touchstone)
          cargo test -p touchstone-conformance

      - name: Package
        run: |
          tar -czf touchstone-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release touchstone
          shasum -a 256 touchstone-${{ matrix.target }}.tar.gz > touchstone-${{ matrix.target }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: touchstone-${{ matrix.target }}
          path: touchstone-${{ matrix.target }}.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # Checksums are published alongside, so a download can be checked before it is run.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            touchstone-*.tar.gz
            touchstone-*.tar.gz.sha256
          generate_release_notes: true
