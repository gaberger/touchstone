# Primary adapter -- mcp.
[package]
name = "touchstone-mcp-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "touchstone: mcp-adapter adapter"

[dependencies]
touchstone-usecases = { path = "../../../touchstone-usecases" }
touchstone-ports = { path = "../../../touchstone-ports" }
rmcp = { version = "3.1", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
