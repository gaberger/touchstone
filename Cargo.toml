# Touchstone Rust workspace.
#
# The hexagonal rules in ARCHITECTURE.md are enforced by THIS dependency graph, not by a linter:
# a crate can only import what its [dependencies] declare, so a violation is a COMPILE ERROR.
# Cargo also forbids dependency cycles outright. `touchstone-cli/tests/architecture.rs` guards the graph
# itself, so the enforcement cannot be quietly relaxed by adding a dependency.
[workspace]
resolver = "2"
members = [
  "touchstone-domain",
  "touchstone-ports",
  "touchstone-usecases",
  "touchstone-adapters/primary/cli",
  "touchstone-adapters/primary/mcp",
  "touchstone-adapters/secondary/yaml-serde",
  "touchstone-adapters/secondary/fs-bundle",
  "touchstone-adapters/secondary/sqlite-index",
  "touchstone-adapters/secondary/git-attest",
  "touchstone-adapters/secondary/crdt-sync",
  "touchstone-adapters/secondary/embed-local",
  "touchstone-cli",
  "touchstone-conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Inherited by every member crate, so metadata cannot drift between them.
license = "MIT"
repository = "https://github.com/gaberger/touchstone"
homepage = "https://github.com/gaberger/touchstone"
authors = ["Gary Berger"]
rust-version = "1.85"
keywords = ["knowledge-base", "mcp", "provenance", "okf", "agent"]
categories = ["command-line-utilities", "text-processing"]
