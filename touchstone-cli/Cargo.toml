# Composition root -- the ONLY crate allowed to import adapters (rule 6).
[package]
name = "touchstone-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Provenance and portability for machine-written knowledge -- CLI and MCP server"

# The crate is `touchstone-cli`; the shipped binary is plain `touchstone`.
[[bin]]
name = "touchstone"
path = "src/main.rs"

[dependencies]
touchstone-ports = { path = "../touchstone-ports" }
touchstone-usecases = { path = "../touchstone-usecases" }
clap = { version = "4", features = ["derive"] }
touchstone-cli-adapter = { path = "../touchstone-adapters/primary/cli" }
touchstone-mcp-adapter = { path = "../touchstone-adapters/primary/mcp" }
touchstone-yaml-serde = { path = "../touchstone-adapters/secondary/yaml-serde" }
touchstone-fs-bundle = { path = "../touchstone-adapters/secondary/fs-bundle" }
touchstone-sqlite-index = { path = "../touchstone-adapters/secondary/sqlite-index" }
touchstone-git-attest = { path = "../touchstone-adapters/secondary/git-attest" }
touchstone-crdt-sync = { path = "../touchstone-adapters/secondary/crdt-sync" }
touchstone-embed-local = { path = "../touchstone-adapters/secondary/embed-local" }
rusqlite = { version = "0.40", features = ["bundled"] }
# The MCP transports. tokio because MCP is async; axum to host the Streamable HTTP tower
# service. Both live in the composition root, not in the MCP adapter -- choosing HOW to serve
# is a wiring decision, and keeping it here means the tool surface stays transport-agnostic.
rmcp = { version = "3.1", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal"] }
axum = "0.8"
# Filesystem watching for `touchstone watch`. In the composition root rather than an adapter:
# WHEN to reindex is a wiring decision, and the use case does not care what woke it.
notify = "8"
