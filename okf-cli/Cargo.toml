# Composition root -- the ONLY crate allowed to import adapters (rule 6).
[package]
name = "okf-cli"
version.workspace = true
edition.workspace = true

# The product is Touchstone; the okf-* crates are named for the FORMAT they implement.
[[bin]]
name = "touchstone"
path = "src/main.rs"

[dependencies]
okf-ports = { path = "../okf-ports" }
okf-usecases = { path = "../okf-usecases" }
clap = { version = "4", features = ["derive"] }
okf-cli-adapter = { path = "../okf-adapters/primary/cli" }
okf-mcp-adapter = { path = "../okf-adapters/primary/mcp" }
okf-yaml-serde = { path = "../okf-adapters/secondary/yaml-serde" }
okf-fs-bundle = { path = "../okf-adapters/secondary/fs-bundle" }
okf-sqlite-index = { path = "../okf-adapters/secondary/sqlite-index" }
okf-git-attest = { path = "../okf-adapters/secondary/git-attest" }
okf-crdt-sync = { path = "../okf-adapters/secondary/crdt-sync" }
okf-embed-local = { path = "../okf-adapters/secondary/embed-local" }
rusqlite = { version = "0.40", features = ["bundled"] }
